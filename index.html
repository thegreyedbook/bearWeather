<title>Bear Weather</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: two views. Overview = three location cards for at-a-glance comparison. Tap a card = full-screen location view (switcher bar, wind hero, light times, forecast). Dark-first: used before dawn. */
:root{
  --bg:#0f1210; --surface:#171b18; --surface-2:#1f2420; --line:#2c332d;
  --fg:#eef0ea; --muted:#9aa396; --faint:#6b7468;
  --blaze:#ff7a1a;            /* hunter orange: accent */
  --rain:#4fa8ff;
  --front:#7cc4ff; --front-hi:#a9d8ff; --front-bg:#13212e; --front-line:#27435c;
  --rain-2:#2f78c4; --rain-3:#1f4f86;
  --sun:#ffc93c; --moon:#d9dccf; --cloud:#c8cec4; --cloud-dk:#8b948a; --storm:#5f6876;
  --calm:#6fcf8a; --breezy:#f2c14e; --windy:#ff5c4d;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

/* header */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
h1 span{color:var(--blaze)}
.meta{color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}
.pill.sample{border-color:var(--blaze);color:var(--blaze)}
.src{font-size:12px;font-weight:600;letter-spacing:.02em}
.src.ok{color:var(--calm)}
.src.old{color:var(--breezy)}
.pill.live{border-color:var(--calm);color:var(--calm)}
.pill.stale{border-color:var(--breezy);color:var(--breezy)}
button.refresh:disabled{opacity:.5;cursor:default}
button.refresh{background:var(--surface-2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:600 13px var(--body);cursor:pointer}
button:focus-visible,.card:focus-visible{outline:2px solid var(--blaze);outline-offset:2px}

/* location cards */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;text-align:left;color:inherit;font:inherit;
  display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto auto;gap:6px 12px;transition:border-color .15s,background .15s}
.card:hover{border-color:#47513f}
.card[aria-pressed="true"]{border-color:var(--blaze);background:var(--surface-2)}
.card .name{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline}
.card .name b{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.card .name small{color:var(--faint);font-size:12px}
.card .temp{font-size:68px;font-weight:700;line-height:.95}
.card .temp sup{font-size:26px;color:var(--muted);vertical-align:top;position:relative;top:8px}
.card .feels{color:var(--muted);font-size:13px}
.card .dial{grid-row:2/4;grid-column:2;align-self:center}
.stats{grid-column:1/-1;display:grid;grid-template-columns:1.3fr 1fr auto;align-items:end;gap:8px;margin-top:6px;border-top:1px solid var(--line);padding-top:10px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
.stat .v{font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .v small{font-size:14px;color:var(--muted);font-weight:600}

.hint{color:var(--faint);font-size:13px;text-align:center}
.wxstrip{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.wxp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.wxk{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.wxnone{color:var(--faint);font-size:13px}
.wxp .big{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.wxp .big small{font-size:14px;color:var(--muted);font-weight:600}
.rainrow{display:flex;gap:14px;align-items:center}
.gauge{width:92px;height:auto;flex:none}
.rainnums{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.rl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.rl i{width:10px;height:10px;border-radius:2px;flex:none}
.rl b{margin-left:auto;font-family:var(--display);font-size:17px;color:var(--fg);font-variant-numeric:tabular-nums}
.wxsrc{font-size:11px;color:var(--faint)}.wxsrc.ok{color:var(--calm)}
.presrow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ptrend{font-weight:700;font-size:13px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--fg)}
.ptrend.fall2{color:var(--windy);border-color:var(--windy)}.ptrend.fall{color:var(--breezy);border-color:var(--breezy)}
.ptrend.rise,.ptrend.rise2{color:var(--front);border-color:var(--front-line)}
.pd3{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pchart{width:100%;max-width:460px;height:auto;display:block}
.pmsg{font-size:14px;color:var(--fg)}
.chilo{display:flex;gap:12px;margin-top:4px;font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.chilo i{font-style:normal;font-family:var(--body);font-size:11px;font-weight:600;color:var(--muted);margin-right:3px;letter-spacing:.06em}
.chilo .lo{color:var(--muted)}
.fchip{display:inline-flex;align-items:center;gap:6px;color:var(--front);background:var(--front-bg);border:1px solid var(--front-line);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.fcell{justify-self:end}
.fchip.strong,.fbanner.strong .fhead{color:var(--front-hi)}
.fbanner{background:var(--front-bg);border:1px solid var(--front-line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.fhead{display:flex;align-items:center;gap:10px;color:var(--front);flex-wrap:wrap}
.fhead b{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.05em;text-transform:uppercase}
.fhead span{font-family:var(--display);font-weight:700;font-size:20px;color:var(--fg)}
.ffacts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--fg)}
.ffacts b{color:var(--front-hi)}
.fafter{font-size:14px;color:var(--muted)}.fafter b{color:var(--blaze)}
.fmore{font-size:12px;color:var(--muted)}
.fnone{font-size:13px;color:var(--faint);padding-inline:4px}
.ftag{display:block;margin:4px auto 0;width:max-content;font:700 10px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--bg);background:var(--front);border-radius:4px;padding:2px 6px}
.ftag.post{background:none;color:var(--blaze);border:1px solid var(--blaze)}
.dirnote{font-size:12px;color:var(--breezy)}
.templine{display:flex;align-items:center;gap:10px}
.now .templine{margin-top:14px;gap:14px}
.now .templine .bigtemp{margin-top:0}
.skylbl{color:var(--fg);font-weight:600}
.sky{display:block;margin:0 auto;flex:none}
.switch .ab{display:none}
.switch button .sky{margin:0}

/* location view */
.detail{display:flex;flex-direction:column;gap:18px}
.detail.enter-r{animation:inR .22s ease-out}.detail.enter-l{animation:inL .22s ease-out}.detail.enter{animation:inUp .22s ease-out}
@keyframes inR{from{opacity:.3;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:.3;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes inUp{from{opacity:.3;transform:translateY(16px)}to{opacity:1;transform:none}}
.locbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line)}
.back{background:none;border:0;color:var(--muted);font:600 14px var(--body);cursor:pointer;padding:6px 4px;display:flex;align-items:center;gap:6px}
.back:hover{color:var(--fg)}
.switch{display:flex;gap:6px;flex-wrap:wrap}
.switch button{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:6px 12px;cursor:pointer;display:flex;gap:8px;align-items:center;font:700 14px var(--display);text-transform:uppercase;letter-spacing:.05em}
.switch button b{font-size:16px;color:var(--fg);font-variant-numeric:tabular-nums}
.switch button[aria-current="true"]{border-color:var(--blaze);color:var(--blaze);background:var(--surface-2)}
.switch .dot{width:8px;height:8px;border-radius:50%}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;
  grid-template-columns:minmax(0,1.15fr) auto minmax(0,1fr) auto;grid-template-areas:"now wind wtext sun";gap:24px;align-items:center}
.hero>.now{grid-area:now}.hero>.wdial{grid-area:wind}.hero>.windtext{grid-area:wtext}.hero>.sunbox{grid-area:sun}
.wdial{width:260px;max-width:100%}.sunbox{width:220px;max-width:100%}
.wdial svg,.sunbox svg{display:block;width:100%;height:auto}
.now h2{margin:0;font-family:var(--display);font-weight:800;font-size:30px;text-transform:uppercase;letter-spacing:.04em;line-height:1}
.now .date{color:var(--muted);font-size:13px;margin-top:4px}
.now .bigtemp{font-family:var(--display);font-weight:700;font-size:96px;line-height:.9;margin-top:14px;font-variant-numeric:tabular-nums}
.now .bigtemp sup{font-size:32px;color:var(--muted);vertical-align:top;position:relative;top:12px}
.now .feels{color:var(--muted);font-size:14px}
.now .stats{grid-template-columns:1fr 1fr;margin-top:14px}
.windtext{display:flex;flex-direction:column;gap:6px;min-width:0}
.windtext .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.windtext .from{font-family:var(--display);font-weight:800;font-size:56px;line-height:1}
.windtext .desc{font-size:18px;font-weight:600}

.windtext .gust{color:var(--muted);font-size:14px}
.trend{display:flex;gap:4px;align-items:flex-end;margin-top:8px}
.trend div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--faint)}
.trend span.n{font-family:var(--display);font-weight:700;font-size:14px}

/* hi/lo in hero */
.hilo{display:flex;gap:18px;align-items:baseline;margin-top:12px;font-family:var(--display);font-variant-numeric:tabular-nums}
.hilo span{display:flex;align-items:baseline;gap:5px;font-weight:700;font-size:30px;line-height:1}
.hilo i{font-style:normal;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hilo .lo{color:var(--muted)}
/* light strip: flat, read-only band (no card chrome so nothing looks tappable) */
.lightstrip{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:14px}
.lseg{display:flex;flex-direction:column;gap:6px;padding-inline:18px;min-width:0}
.lseg+.lseg{border-left:1px solid var(--line)}
.lseg:first-child{padding-left:4px}
.lseg .k{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lpair{display:flex;align-items:center;gap:12px}
.lt2{display:flex;flex-direction:column;line-height:1}
.lt2 b{font-family:var(--display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums}
.lt2 b small{font-size:14px;color:var(--muted);font-weight:600;margin-left:2px}
.lt2 em{font-style:normal;font-size:12px;color:var(--muted);margin-top:4px}
.lt2.key b{color:var(--blaze)}
.lt2.key em{color:var(--blaze)}
.grad{flex:1;min-width:24px;max-width:90px;height:6px;border-radius:3px;align-self:center;margin-top:-14px}
.grad.am{background:linear-gradient(90deg,#2a3550,var(--sun))}
.grad.pm{background:linear-gradient(90deg,var(--sun),#2a3550)}
.lseg.cd b{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}

/* tabs */
.tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.tabs button{background:none;border:0;color:var(--muted);font:700 15px var(--display);text-transform:uppercase;letter-spacing:.06em;padding:8px 18px;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--blaze);color:#1a0d02}
/* radar (loads only when opened) */
.radar{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.radar-tog{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--fg);padding:14px 16px;cursor:pointer;text-align:left;font:inherit}
.radar-tog:hover{background:var(--surface-2)}
.radar-tog .t{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.radar-tog .s{color:var(--muted);font-size:13px;flex:1;min-width:0}
.radar-tog .chev{color:var(--blaze);font-size:18px;transition:transform .15s}
.radar-tog[aria-expanded="true"] .chev{transform:rotate(90deg)}
.radar-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.radar-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.radar-bar .tabs button{padding:6px 14px;font-size:14px}
.radar-bar a{color:var(--muted);font-size:13px}
.radar-frame{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:10px;min-height:220px;display:grid;place-items:center;overflow:hidden}
.radar-frame img{display:block;width:100%;height:auto;max-width:900px}
.radar-msg{color:var(--muted);font-size:14px;padding:24px;text-align:center}
.radar-note{color:var(--faint);font-size:12px}
.fc-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* forecast table */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;min-width:64px}
tr:last-child td{border-bottom:0}
th[scope=row]{position:sticky;left:0;background:var(--surface);text-align:left;font:600 11px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);min-width:96px;z-index:1}
thead th{font-family:var(--display);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.04em;background:var(--surface-2)}
thead th small{display:block;font:500 11px var(--body);color:var(--faint);text-transform:none;letter-spacing:0}
thead th.now{color:var(--blaze)}
.t-hi{font-family:var(--display);font-weight:700;font-size:22px}
.t-lo{font-family:var(--display);font-weight:600;font-size:18px;color:var(--muted)}
.pp{display:flex;flex-direction:column;align-items:center;gap:4px}
.pp b{font-family:var(--display);font-size:17px;color:var(--rain)}
.pp b.zero{color:var(--faint)}
.pbar{width:36px;height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.pbar span{display:block;height:100%;background:var(--rain)}
.wcell{display:flex;flex-direction:column;align-items:center;gap:2px}
.wcell .spd{font-family:var(--display);font-weight:700;font-size:18px}
.wcell .g{font-size:12px;color:var(--muted)}
.wcell .d{font-size:11px;color:var(--faint);letter-spacing:.04em}
.ltime{font-family:var(--display);font-weight:600;font-size:16px}

footer{color:var(--faint);font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

@media (max-width:1120px){
  .hero{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"now now now" "wind wtext sun"}
}
@media (max-width:760px){
  .hero{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"now now" "wind sun" "wtext wtext";justify-items:center}
  .wdial,.sunbox{width:100%;max-width:240px}
}
@media (max-width:900px){
  .cards{grid-template-columns:1fr}
}
@media (max-width:600px){
  .hero{text-align:center;padding:18px;gap:16px}
  .now .stats{text-align:left}
  .windtext{align-items:center}
  .lightstrip{grid-template-columns:1fr;gap:12px}
  .wxstrip{grid-template-columns:1fr}
  .lseg,.lseg:first-child{padding-inline:4px}
  .lseg+.lseg{border-left:0;border-top:1px solid var(--line);padding-top:12px}
  .hilo{justify-content:center}
  .card .temp{font-size:56px}
  .now .bigtemp{font-size:76px}
  .windtext .from{font-size:44px}
  .switch button{padding:6px 9px}
  .switch button .nm{display:none}
  .switch button .ab{display:inline}
  .now .templine{justify-content:center}
  .tabs button{padding:8px 11px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Bear <span>Weather</span></h1>
    <div class="meta">
      <span class="pill" id="status">Loading…</span>
      <span id="updated"></span>
      <button class="refresh" id="refresh" type="button">Refresh</button>
    </div>
  </header>

  <div id="overview" style="display:flex;flex-direction:column;gap:12px">
    <section class="cards" id="cards" aria-label="Locations"></section>
    <p class="hint">Tap a location for the wind dial, light times, and forecast.</p>
  </div>

  <section class="detail" id="detail" hidden></section>

  <footer>
    <span>Wind arrows point downwind, the way your scent travels. "Now" readings come from airport sensors (NWS); forecasts come from the Open-Meteo model.</span>
    <span><a href="https://open-meteo.com/" target="_blank" rel="noopener" style="color:var(--muted)">Weather data by Open-Meteo.com</a> · first/last light = civil twilight</span>
  </footer>
</div>

<script>
/* ---------- config: add a region here ---------- */
const LOCATIONS = [
  // lat/lon = forecast point (model). station = NWS sensor used for "Now" readings.
  {id:"hou", name:"Houston",     abbr:"HOU",  lat:29.6454,  lon:-95.2789,   station:"KHOU", stationName:"Hobby Airport", radar:"KHGX", radarName:"Houston/Galveston",
   base:{t:79,h:78,dir:150,spd:9,pp:30},  sun:["7:22","6:51"]},
  {id:"sat", name:"San Antonio", abbr:"SA",   lat:29.3842,  lon:-98.5811,   station:"KSKF", stationName:"Kelly Field", radar:"KEWX", radarName:"New Braunfels",
   base:{t:84,h:55,dir:175,spd:12,pp:10}, sun:["7:35","7:04"]},
  {id:"rks", name:"Rocksprings", abbr:"ROCK", lat:30.10205, lon:-100.16536, station:"KECU", stationName:"Edwards Co. Airport", radar:"KDFX", radarName:"Laughlin AFB",
   base:{t:81,h:34,dir:220,spd:16,pp:0},  sun:["7:42","7:12"]},
];
const OBS_STALE_MIN=90;   // flag a sensor reading older than this

/* ---------- sensor readings: NWS latest observation per station ---------- */
const obsUrl=id=>`https://api.weather.gov/stations/${id}/observations?limit=8`;
const DIR_LOOKBACK_MIN=75;  // reuse a direction from a recent reading if the latest has none
function q(o,kind){
  if(!o||o.value==null) return null;
  const u=o.unitCode||"", v=o.value;
  if(kind==="F") return /degF/.test(u)?v:v*9/5+32;
  if(kind==="mph") return /km_h/.test(u)?v/1.609344:/m_s/.test(u)?v*2.236936:/kn|kt/.test(u)?v*1.150779:v;
  if(kind==="in") return /:mm$/.test(u)?v/25.4:/:m$/.test(u)?v*39.3701:v;
  return v;
}
/* Wind straight from the raw airport report (METAR), e.g. "33015G25KT 300V360".
   The processed NWS fields sometimes drop speed/direction while the METAR has them. */
function metarWind(raw){
  if(!raw) return null;
  const body=raw.split(" RMK")[0];
  const m=body.match(/\s(\d{3}|VRB)(\d{2,3})(?:G(\d{2,3}))?(KT|MPS)\b/); if(!m) return null;

  const now=Date.now(), dur=ms=>{const m=Math.max(0,Math.round(ms/6e4));return m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m} min`};
  if(now<d0.firstAt) return {k:"First light in",v:dur(d0.firstAt-now)};

}

/* 24-hour sun clock: midnight at top, noon at bottom, time runs clockwise */

    :`<g transform="translate(${mx} ${my})"><circle r="7" fill="var(--moon)"/><circle cx="3.5" cy="-2.5" r="6" fill="var(--surface-2)"/></g>`;

/* ---------- cold front detection ----------
   Day D is flagged when, versus the day before:
   · the dominant wind turns north (NW–NE) from a southerly/westerly flow, and
   · highs fall ≥8°F (over D or D+1) or mean pressure rises ≥2.5 mb;
   or highs fall ≥12°F with pressure rising. "Strong" = highs fall ≥15°F. */

    const p=days[i-1], d=days[i], n=days[i+1];
    const drop=p.hi-Math.min(d.hi,n?n.hi:d.hi);
    const dp=(d.pres!=null&&p.pres!=null)?d.pres-p.pres:null;
    const presRise=dp!=null&&dp>=2.5;
    const flip=isNorth(d.dir)&&!isNorth(p.dir);
    if(!((flip&&(drop>=8||presRise))||(drop>=12&&presRise))) continue;

    let at=null;

    for(let k=3;k<hs.length;k++){

      if(t.slice(0,10)>d.iso) break;

    }

    const after=l.daily.slice(dayIdx+1,dayIdx+3).filter(x=>x.pp<40&&x.spd<=18).map(x=>x.label);

function frontWhen(f){
  const lbl=f.day.label==="Today"?"today":f.day.label;

}

  const f=(l.fronts||[])[0]; if(!f) return "";

const frontIcon=s=>`<svg width="${s}" height="${s}" viewBox="0 0 16 16" aria-hidden="true"><path d="M1 12 L15 12" stroke="currentColor" stroke-width="2"/><path d="M3 12 L5.5 7 L8 12Z M9 12 L11.5 7 L14 12Z" fill="currentColor"/></svg>`;

/* ---------- rain gauge (24 / 48 / 72 h) ---------- */
function buildRain(l,hist){

    const sum=(a,b)=>hist.rows.filter(r=>r.t>now-b*H&&r.t<=now-a*H).reduce((x,r)=>x+r.p,0);

  }
  const h=l._h; if(!h||!h.precip.length) return null;
  const sumM=(a,b)=>{let t=0;for(let k=h.i0-b;k<h.i0-a;k++) if(k>=0&&h.precip[k]!=null) t+=h.precip[k];return t};

/* ---------- pressure: sensor history + bias-corrected model forecast (inHg) ---------- */
function buildPres(l,obs,hist){

function presTrend(d3){
  if(d3==null) return {k:"steady",t:"Trend unknown",m:"Not enough recent readings to judge the trend."};
  if(d3<=-0.06) return {k:"fall2",t:"Falling fast",m:"Falling fast: storms or a front likely within 12–24 hrs."};
  if(d3<=-0.02) return {k:"fall",t:"Falling",m:"Falling: clouds and weather moving in."};
  if(d3>=0.06)  return {k:"rise2",t:"Rising fast",m:"Rising fast: post-front clearing, cooler and breezy."};
  if(d3>=0.02)  return {k:"rise",t:"Rising",m:"Rising: clearing and drying out."};

}

    return `<button class="card" type="button" data-id="${l.id}" aria-label="Open ${l.name}">
      <div class="name"><b>${l.name}</b>${srcChip(l)}</div>
      <div><div class="templine">${skyIcon(c.sky,52,c.night)}<div class="temp num">${c.temp}<sup>°F</sup></div></div><div class="feels">${c.skyText||SKY[c.sky]}</div><div class="chilo"><span><i>H</i>${l.daily[0].hi}°</span><span class="lo"><i>L</i>${l.daily[0].lo}°</span></div></div>
      <div class="dial">${dial(c.dir,c.spd,104,false,c.dirVar||c.windModel)}</div>
      <div></div>
      <div class="stats">
        <div class="stat"><div class="k">Wind</div><div class="v" style="color:${windColor(c.spd)}">${c.dir==null?"Calm":c.dirVar?`VRB ${c.spd}`:`${card8(c.dir)} ${c.spd}`}${c.windModel?"<small>*</small>":""} ${c.gust!=null?`<small>G ${c.gust}</small>`:""}</div></div>
        <div class="stat"><div class="k">Humidity</div><div class="v">${pct(c.hum)}<small>%</small></div></div>
        <div class="stat fcell">${frontChip(l)}</div>
      </div>
    </button>`}).join("");
}

function dayTag(l,i){
  const fs=l.fronts||[];
  if(fs.some(f=>f.dayIdx===i)) return `<span class="ftag">Front</span>`;
  if(fs.some(f=>i>f.dayIdx&&i<=f.dayIdx+2&&l.daily[i].pp<40&&l.daily[i].spd<=18)) return `<span class="ftag post">After</span>`;
  return "";
}
function tableHourly(l){
  const h=l.hourly;
  return `<table><thead><tr><th scope="row">Time</th>${h.map((x,i)=>`<th class="${i===0?"now":""}">${x.label}${(l.fronts||[]).some(f=>f.at&&x.t&&f.at.slice(0,13)===x.t.slice(0,13))?`<span class="ftag">Front</span>`:""}</th>`).join("")}</tr></thead><tbody>
  <tr><th scope="row">Sky</th>${h.map(x=>`<td>${skyIcon(x.sky,34,x.night)}</td>`).join("")}</tr>
  <tr><th scope="row">Temp</th>${h.map(x=>`<td class="t-hi">${x.temp}°</td>`).join("")}</tr>
  <tr><th scope="row">Rain chance</th>${h.map(x=>ppCell(x.pp)).join("")}</tr>
  <tr><th scope="row">Wind</th>${h.map(windCell).join("")}</tr></tbody></table>`;
}
function tableDaily(l,n){
  const d=l.daily.slice(0,n);
  return `<table><thead><tr><th scope="row">Day</th>${d.map((x,i)=>`<th class="${i===0?"now":""}">${x.label}<small>${x.date}</small>${dayTag(l,i)}</th>`).join("")}</tr></thead><tbody>
  <tr><th scope="row">Sky</th>${d.map(x=>`<td>${skyIcon(x.sky,36)}</td>`).join("")}</tr>
  <tr><th scope="row">High</th>${d.map(x=>`<td class="t-hi">${x.hi}°</td>`).join("")}</tr>
  <tr><th scope="row">Low</th>${d.map(x=>`<td class="t-lo">${x.lo}°</td>`).join("")}</tr>
  <tr><th scope="row">Rain chance</th>${d.map(x=>ppCell(x.pp)).join("")}</tr>
  <tr><th scope="row">Wind (max)</th>${d.map(windCell).join("")}</tr>
  <tr><th scope="row">First light</th>${d.map(x=>`<td class="ltime">${x.first}a</td>`).join("")}</tr>
  <tr><th scope="row">Sunrise</th>${d.map(x=>`<td class="ltime">${x.rise}a</td>`).join("")}</tr>
  <tr><th scope="row">Sunset</th>${d.map(x=>`<td class="ltime">${x.set}p</td>`).join("")}</tr>
  <tr><th scope="row">Last light</th>${d.map(x=>`<td class="ltime">${x.last}p</td>`).join("")}</tr></tbody></table>`;
}
const ppCell=p=>`<td><div class="pp"><b class="${p<5?"zero":""}">${p}%</b><div class="pbar"><span style="width:${p}%"></span></div></div></td>`;
const windCell=x=>`<td><div class="wcell">${arrowMini(x.dir,x.spd)}<span class="spd" style="color:${windColor(x.spd)}">${x.spd}</span><span class="g">G ${x.gust}</span><span class="d">${card8(x.dir)}</span></div></td>`;

function renderDetail(dirn){
  const l=DATA.find(x=>x.id===selected)||DATA[0], c=l.current, t=l.daily[0];
  const el=document.getElementById("detail");
  el.className="detail "+(dirn>0?"enter-r":dirn<0?"enter-l":"enter");
  el.innerHTML=`
    <div class="locbar">
      <button class="back" type="button" data-act="back">← All locations</button>
      <div class="switch" role="tablist" aria-label="Switch location">
        ${DATA.map(x=>`<button type="button" data-loc="${x.id}" aria-current="${x.id===l.id}"><span class="dot" style="background:${windColor(x.current.spd)}"></span><span class="nm">${x.name}</span><span class="ab">${x.abbr}</span>${skyIcon(x.current.sky,20,x.current.night)}<b>${x.current.temp}°</b></button>`).join("")}
      </div>
    </div>
    <div class="hero">
      <div class="now">
        <h2>${l.name}</h2>
        <div class="date">${l.asOf}</div>
        <div class="templine">${skyIcon(c.sky,84,c.night)}<div class="bigtemp">${c.temp}<sup>°F</sup></div></div>
        <div class="feels"><b class="skylbl">${c.skyText||SKY[c.sky]}</b></div>
        <div class="hilo" aria-label="Today's high and low"><span><i>High</i>${t.hi}°</span><span class="lo"><i>Low</i>${t.lo}°</span></div>
        <div class="stats">
          <div class="stat"><div class="k">Rain last hr</div><div class="v" style="color:${c.precip?"var(--rain)":"var(--fg)"}">${precipTxt(c.precip)}<small>in</small></div></div>
          <div class="stat"><div class="k">Humidity</div><div class="v">${pct(c.hum)}<small>%</small></div></div>
        </div>
      </div>
      <div class="wdial">${dial(c.dir,c.spd,260,true,c.dirVar||c.windModel)}</div>
      <div class="windtext">
        <span class="k">Wind from</span>
        <span class="from" style="color:${windColor(c.spd)}">${c.dirVar?"Variable":card8(c.dir)}</span>
        ${c.windModel?`<span class="dirnote">Sensor didn't report wind. Showing model estimate.</span>`:c.dirVar?`<span class="dirnote">Sensor shows no steady direction. Model estimate: ${card8(c.dir)}</span>`:c.dirAt?`<span class="dirnote">Wind from ${c.dirAt} reading</span>`:""}
        <span class="desc">${beaufort(c.spd)}</span>
        <span class="gust">${c.dir==null&&c.spd<1?"No measurable wind":`${c.spd} mph sustained · ${gustTxt(c.gust)}`}</span>
        <span class="k" style="margin-top:8px">Next 6 hours (forecast)</span>
        <div class="trend">${l.hourly.slice(1,7).map(h=>`<div>${arrowMini(h.dir,h.spd)}<span class="n" style="color:${windColor(h.spd)}">${h.spd}</span>${h.label}</div>`).join("")}</div>
      </div>
      <div class="sunbox" id="sundial">${sunDial(l)}</div>
    </div>
    <div class="lightstrip" aria-label="Light times today">
      <div class="lseg">
        <span class="k">Morning</span>
        <div class="lpair">
          <div class="lt2 key"><b>${t.first}<small>am</small></b><em>First light</em></div>
          <div class="grad am" aria-hidden="true"></div>
          <div class="lt2"><b>${t.rise}<small>am</small></b><em>Sunrise</em></div>
        </div>
      </div>
      <div class="lseg">
        <span class="k">Evening</span>
        <div class="lpair">
          <div class="lt2"><b>${t.set}<small>pm</small></b><em>Sunset</em></div>
          <div class="grad pm" aria-hidden="true"></div>
          <div class="lt2 key"><b>${t.last}<small>pm</small></b><em>Last light</em></div>
        </div>
      </div>
      ${(()=>{const ls=lightStatus(l);return ls?`<div class="lseg cd" id="lightcd"><span class="k">${ls.k}</span><b>${ls.v}</b></div>`:""})()}
    </div>
    <div class="wxstrip">${rainPanel(l)}${presPanel(l)}</div>
    ${frontBanner(l)}
    ${radarSection(l)}
    <div class="fc-head">
      <div class="tabs" role="tablist">
        ${[["hourly","Hourly"],["5","5-Day"],["7","7-Day"],["10","10-Day"]].map(([k,v])=>`<button role="tab" type="button" data-tab="${k}" aria-selected="${tab===k}">${v}</button>`).join("")}
      </div>
      <div class="legend"><span><i style="background:var(--calm)"></i>Under 8 mph</span><span><i style="background:var(--breezy)"></i>8–15</span><span><i style="background:var(--windy)"></i>16+</span></div>
    </div>
    <div class="scroll">${tab==="hourly"?tableHourly(l):tableDaily(l,+tab)}</div>`;
}

/* ---------- view switching ---------- */
const $ov=document.getElementById("overview"), $dt=document.getElementById("detail");
function openLoc(id,dirn=0){
  selected=id; try{localStorage.setItem("bw-sel",id)}catch(_){}
  $ov.hidden=true; $dt.hidden=false; renderDetail(dirn);
  try{history.replaceState(null,"","#"+id)}catch(_){}
  if(!dirn) window.scrollTo(0,0);
}
function showOverview(){ $dt.hidden=true; $ov.hidden=false; renderCards(); window.scrollTo(0,0); try{history.replaceState(null,"",location.pathname+location.search)}catch(_){} }
function step(d){
  const i=DATA.findIndex(x=>x.id===selected), n=(i+d+DATA.length)%DATA.length;
  openLoc(DATA[n].id,d);
}

document.getElementById("cards").addEventListener("click",e=>{
  const b=e.target.closest(".card"); if(b) openLoc(b.dataset.id);
});
$dt.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab]");
  if(t){ tab=t.dataset.tab; try{localStorage.setItem("bw-tab",tab)}catch(_){} const y=window.scrollY; renderDetail(); $dt.className="detail"; window.scrollTo(0,y); return; }
  const l=e.target.closest("[data-loc]");
  if(l){ const i=DATA.findIndex(x=>x.id===selected), j=DATA.findIndex(x=>x.id===l.dataset.loc); if(i!==j) openLoc(l.dataset.loc,j>i?1:-1); return; }
  if(e.target.closest("[data-act=radar]")){ radarOpen=!radarOpen; const y=window.scrollY; renderDetail(); $dt.className="detail"; window.scrollTo(0,y); return; }
  const rm=e.target.closest("[data-rmode]");
  if(rm){ radarMode=rm.dataset.rmode; const y=window.scrollY; renderDetail(); $dt.className="detail"; window.scrollTo(0,y); return; }
  if(e.target.closest("[data-act=back]")) showOverview();
});
document.addEventListener("keydown",e=>{
  if($dt.hidden) return;
  if(e.key==="ArrowRight") step(1);
  else if(e.key==="ArrowLeft") step(-1);
  else if(e.key==="Escape") showOverview();
});
/* swipe left/right on the hero to change location */
let sx=null,sy=null;
$dt.addEventListener("touchstart",e=>{ if(e.target.closest(".scroll"))return; sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
$dt.addEventListener("touchend",e=>{
  if(sx===null)return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) step(dx<0?1:-1);
});
document.querySelector("h1").addEventListener("click",showOverview);
document.querySelector("h1").style.cursor="pointer";
/* ---------- loading, caching, refresh ---------- */
const $status=document.getElementById("status"), $upd=document.getElementById("updated"), $btn=document.getElementById("refresh");
const CACHE_KEY="bw-cache-v7";
let lastFetch=0, live=false, timer=null;

function render(){ if(!DATA)return; if($dt.hidden) renderCards(); else { renderCards(); const y=window.scrollY; renderDetail(); $dt.className="detail"; window.scrollTo(0,y); } }
function tickLight(){
  const el=document.getElementById("lightcd"); if(!el||!DATA||$dt.hidden) return;
  const l=DATA.find(x=>x.id===selected), ls=l&&lightStatus(l); if(!ls) return;
  el.innerHTML=`<span class="k">${ls.k}</span><b>${ls.v}</b>`;
  const sd=document.getElementById("sundial"); if(sd) sd.innerHTML=sunDial(l);
}
function setStatus(){
  tickLight();
  if(!live){ $status.className="pill sample"; $status.textContent="Sample data"; return; }
  const mins=Math.round((Date.now()-lastFetch)/6e4);
  const stale=mins>=REFRESH_MIN*2;
  $status.className="pill "+(stale?"stale":"live");
  $status.textContent=stale?"Stale":"Live";
  $upd.textContent=`Updated ${new Date(lastFetch).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})} · ${mins<1?"just now":mins+" min ago"}`;
}
function apply(json,obs,ts,hist){
  const arr=Array.isArray(json)?json:[json];
  DATA=LOCATIONS.map((l,i)=>fromApi(l,arr[i],obs&&obs[i]));
  DATA.forEach((l,i)=>{ l.fronts=detectFronts(l); const hs=hist&&hist[i]; l.rain=buildRain(l,hs); l.pres=buildPres(l,obs&&obs[i],hs); });
  lastFetch=ts; live=true; render(); setStatus();
}
const HIST={};
async function getHist(id){
  const c=HIST[id]; if(c&&Date.now()-c.ts<60*6e4) return c.data;
  try{
    const r=await fetch(histUrl(id),{cache:"no-store"}); if(!r.ok) throw new Error("HTTP "+r.status);
    const data=procHist(await r.json()); HIST[id]={ts:Date.now(),data}; return data;
  }catch(e){ console.warn(`History ${id} unavailable:`,e); return c?c.data:null; }
}
async function getObs(id){
  try{
    const r=await fetch(obsUrl(id),{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j=await r.json();
    const list=(j.features||[]).map(parseObs).filter(Boolean).sort((a,b)=>new Date(b.time)-new Date(a.time));
    const o=list[0]; if(!o) return null;
    const t0=new Date(o.time), recent=x=>(t0-new Date(x.time))/6e4<=DIR_LOOKBACK_MIN;
    if(o.spd==null){                                           // speed missing: borrow a recent reading
      const prev=list.slice(1).find(x=>x.spd!=null && recent(x));
      if(prev){ o.spd=prev.spd; o.dir=prev.dir; o.gust=o.gust??prev.gust; o.windAt=prev.time; }
      else { o.windMissing=true; return o; }                   // fall back to model wind
    }
    if(o.spd<1){ o.dir=null; return o; }                       // true calm
    if(o.dir==null){
      const prev=list.slice(1).find(x=>x.dir!=null && x.spd>=1 && recent(x));
      if(prev){ o.dir=prev.dir; o.windAt=prev.time; } else o.dirVar=true;
    }
    return o;
  }catch(e){ console.warn(`Sensor ${id} unavailable:`,e); return null; }
}

async function load(manual=false){
  if(manual && Date.now()-lastFetch<MANUAL_GAP_S*1000 && live){ setStatus(); return; }
  $btn.disabled=true; $btn.textContent="Refreshing…";
  try{
    const obsP=Promise.all(LOCATIONS.map(l=>getObs(l.station)));
    const histP=Promise.all(LOCATIONS.map(l=>getHist(l.station)));
    const res=await fetch(apiUrl(),{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const json=await res.json();
    if(json.error) throw new Error(json.reason||"API error");
    const obs=await obsP, hist=await histP;
    const ts=Date.now();
    apply(json,obs,ts,hist);
    try{localStorage.setItem(CACHE_KEY,JSON.stringify({ts,json,obs,hist}))}catch(_){}
  }catch(err){
    console.warn("Live weather fetch failed:",err);
    if(!DATA){ DATA=SAMPLE(); DATA.forEach((l,i)=>{ l.fronts=detectFronts(l); l.rain=sampleRain(i); l.pres=samplePres(i); }); live=false; render(); }
    setStatus();
    $upd.textContent= live ? `Couldn't refresh (${err.message}). Showing last update.` : "Live data unavailable here. Showing sample data.";
  }finally{
    $btn.textContent="Refresh";
    setTimeout(()=>{$btn.disabled=false},live?MANUAL_GAP_S*1000-(Date.now()-lastFetch):0);
  }
}
function schedule(){ clearInterval(timer); timer=setInterval(()=>{ if(!document.hidden) load(); },REFRESH_MIN*6e4); }

$btn.addEventListener("click",()=>load(true));
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden && Date.now()-lastFetch>REFRESH_MIN*6e4) load();
});
setInterval(setStatus,6e4);

/* boot: show cached data instantly, then fetch fresh */
try{
  const c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");
  if(c && Date.now()-c.ts<6*36e5){ apply(c.json,c.obs,c.ts,c.hist); (c.hist||[]).forEach((h,i)=>{ if(h) HIST[LOCATIONS[i].station]={ts:c.ts,data:h}; }); }
}catch(_){}
if(location.hash && LOCATIONS.some(l=>"#"+l.id===location.hash)) selected=location.hash.slice(1);
if(!DATA){ $status.textContent="Loading…"; }
load().then(()=>{ if(location.hash && DATA) openLoc(selected); });
schedule();
</script>
